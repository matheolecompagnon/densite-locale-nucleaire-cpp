[build-system]
requires = ["setuptools>=59.6.0", "wheel", "numpy", "swig==4.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "density_simulation"
version = "0.0.14"
authors = [
  { name="Lecompagnon M.", email="matheo.lecompagnon@ensiie.eu" },
]
description = "This module is a binding for some CPP functions from project IPS-DEV. "
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["numpy"]

[project.urls]
"Homepage" = "https://gitlab.pedago.ensiie.fr/matheo.lecompagnon/prog-scientifique-jmmm"
